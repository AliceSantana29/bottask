<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BotTask - Quadro de Missões</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>&#9876; BotTask</h1>
    <form id="form-usuario">
      <input id="usuario" placeholder="Nome do herói" maxlength="30" required>
      <button type="submit">Entrar</button>
    </form>
  </header>

  <main id="painel" hidden>
    <section class="card" id="status">
      <div class="linha">
        <strong id="nome-jogador"></strong>
        <span id="nivel"></span>
      </div>
      <div class="barra"><div id="barra-xp"></div></div>
      <small id="texto-xp"></small>
    </section>

    <section class="card">
      <h2>&#128220; Nova missão</h2>
      <form id="form-missao">
        <input id="titulo" placeholder="Ex: Derrotar a lista de matemática" maxlength="80" required>
        <select id="dificuldade">
          <option value="facil">Fácil (+10 XP)</option>
          <option value="media">Média (+25 XP)</option>
          <option value="dificil">Difícil (+50 XP)</option>
        </select>
        <button type="submit">Aceitar</button>
      </form>
    </section>

    <section class="card">
      <h2>&#9876; Quadro de missões</h2>
      <ul id="lista-missoes"></ul>
      <p id="vazio" hidden>Nenhuma missão no quadro. Aceite sua primeira aventura!</p>
    </section>

    <section class="card">
      <h2>&#127942; Conquistas</h2>
      <ul id="lista-conquistas" class="medalhas"></ul>
    </section>
  </main>

  <div id="aviso" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
